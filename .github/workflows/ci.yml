name: CI

on:
  push:
    branches: [main]
  pull_request:

# One Neon `test` branch is shared by every run, and the suites truncate it, so runs queue up
# instead of overlapping. (A per-run Neon branch would lift this; not needed yet.)
concurrency:
  group: neon-test-branch
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same shape as scripts/setup-test-db.sh writes locally. TEST_DATABASE_URL is the
      # connection string of the Neon `test` branch; TEST_BETTER_AUTH_SECRET any 32+ chars.
      - name: Write apps/api/.env.test
        run: |
          cat > apps/api/.env.test <<EOF
          CAMPUS_WALK_TEST=1
          DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}
          PORT=3101
          APP_URL=http://localhost:5174
          API_URL=http://localhost:3101
          BETTER_AUTH_SECRET=${{ secrets.TEST_BETTER_AUTH_SECRET }}
          EOF

      - run: pnpm typecheck

      - name: Migrate the test branch
        run: pnpm --filter api db:migrate:test

      - name: Unit and router tests (Vitest)
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
